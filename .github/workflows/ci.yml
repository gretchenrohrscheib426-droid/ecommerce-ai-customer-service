name: Local-contract CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: python -m ruff check src tests scripts annotation
      - run: python -m mypy src/ecommerce_graph_agent
      - run: python -m compileall -q src scripts annotation
      - run: python scripts/generate_demo_data.py --check
      - run: python -m pytest tests/unit tests/e2e/test_api.py -q --junitxml=reports/unit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-unit-report
          path: reports/unit.xml
