name: independent-sample
on:
  workflow_dispatch:
    inputs:
      database_integration:
        description: Run isolated Neo4j integration (no course data)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  isolated-neo4j:
    if: github.event_name == 'workflow_dispatch' && inputs.database_integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      neo4j:
        image: neo4j:5.26.30-community@sha256:037cf5756f0135cbfd66b739b6df7c7c4bb100f9ce11602f6f9538e17e02c74d
        env:
          NEO4J_AUTH: neo4j/ci-ephemeral-only-password
          NEO4J_dbms_usage__report_enabled: 'false'
        ports:
          - 7687:7687
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r envs/ci-requirements.txt -e .
      - run: python -m pytest tests/integration/test_public_ci.py -q
        env:
          ECOMMERCE_CI_DB: '1'
