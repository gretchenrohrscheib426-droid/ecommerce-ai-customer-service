name: Dependency advisory audit
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      # Full installed distribution set, including transitive packages and CPU torch's upstream version.
      # No dependency/model downloads and no advisory suppressions; every package in the lock is checked.
      - run: python -m pip_audit --disable-pip --no-deps -r envs/locks/public/security-requirements.txt --progress-spinner off
